# Neue Version automatisch bereitstellen: Wird APP_VERSION in printdock.py erhöht und auf main
# hochgeladen, prüft dieser Workflow alles und erstellt das Release mit Programm und Installern.
# Ohne neue Versionsnummer passiert nichts. Versionsnummern gehen nie rückwärts.
name: Release

on:
  push:
    branches: [main]
    paths: [printdock.py, windows/**]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      neu: ${{ steps.v.outputs.neu }}
      ver: ${{ steps.v.outputs.ver }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version lesen
        id: v
        run: |
          VER=$(grep -oP '^APP_VERSION = "\K[0-9.]+' printdock.py)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            echo "v$VER gibt es schon – kein neues Release."
            echo "neu=nein" >> "$GITHUB_OUTPUT"; exit 0
          fi
          LAST=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)
          if [ -n "$LAST" ] && [ "$(printf '%s\n%s\n' "$LAST" "$VER" | sort -V | tail -1)" != "$VER" ]; then
            echo "::error::APP_VERSION $VER ist kleiner als die letzte Version $LAST – Versionen dürfen nie rückwärts gehen."
            exit 1
          fi
          echo "neu=ja" >> "$GITHUB_OUTPUT"
      - name: Prüfen
        if: steps.v.outputs.neu == 'ja'
        run: |
          python3 -m py_compile printdock.py
          pip install -q pyflakes && python3 -m pyflakes printdock.py
          for f in linux/*.sh; do bash -n "$f"; done
          python3 tools/sprachen_pruefen.py
      - name: Release erstellen
        if: steps.v.outputs.neu == 'ja'
        run: |
          VER=${{ steps.v.outputs.ver }}
          EXTRA=()
          if [ "$VER" = "1.0.35" ]; then
            # Umbenennung Druckzentrale -> PrintDock: aeltere Fassungen und alte Doppelklick-Installer
            # laden diese Namen; dieselben Dateien einmalig auch darunter bereitstellen
            cp printdock.py /tmp/druckzentrale.py; cp linux/PrintDock-installieren.sh /tmp/Druckzentrale-installieren.sh
            EXTRA=(/tmp/druckzentrale.py /tmp/Druckzentrale-installieren.sh)
          fi
          gh release create "v$VER" printdock.py linux/PrintDock-installieren.sh \
            linux/PrintDock-arch-installer.desktop linux/PrintDock-deb-installer.desktop \
            linux/PrintDock-installer.desktop "${EXTRA[@]}" --target "$GITHUB_SHA" \
            --title "PrintDock v$VER" --generate-notes --latest

  # Windows-Fassung: auf einem echten Windows pruefen, als .exe bauen, Setup bauen, still installieren und
  # deinstallieren, dann PrintDock-setup.exe an dasselbe Release haengen
  windows:
    needs: release
    if: needs.release.outputs.neu == 'ja'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VER: ${{ needs.release.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakete
        run: pip install pyside6 pillow zeroconf pyinstaller
      - name: Auf echtem Windows pruefen
        shell: pwsh
        run: python windows/ci_check.py
      - name: Programm bauen
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed --onedir --name PrintDock --collect-all zeroconf `
            --distpath dist --workpath build printdock.py
          if (-not (Test-Path dist\PrintDock\PrintDock.exe)) { throw "PrintDock.exe fehlt" }
      - name: Programm starten (unsichtbar) und Bildschirmfoto
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QPA_FONTDIR = "$env:WINDIR\Fonts"   # unsichtbar findet Qt die Windows-Schriften sonst nicht
          $env:DZ_SELFTEST = "$env:RUNNER_TEMP\printdock.png"
          $p = Start-Process dist\PrintDock\PrintDock.exe -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "PrintDock beendet sich nicht" }
          if (-not (Test-Path $env:DZ_SELFTEST)) { throw "kein Bildschirmfoto – PrintDock ist nicht gestartet" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bildschirmfoto
          path: ${{ runner.temp }}/printdock.png
      - name: Setup bauen
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $lang = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages"
          if (-not (Test-Path "$lang\ChineseSimplified.isl")) {   # ab Inno Setup 6.4 dabei, sonst nachladen
            Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile "$lang\ChineseSimplified.isl"
          }
          iscc /DAppVersion=$env:VER windows\PrintDock.iss
          if (-not (Test-Path dist\PrintDock-setup.exe)) { throw "Setup fehlt" }
      - name: Setup testen (still installieren und deinstallieren)
        shell: pwsh
        run: |
          $p = Start-Process dist\PrintDock-setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/NOLAUNCH" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Setup: Fehlercode $($p.ExitCode)" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\PrintDock\PrintDock.exe")) { throw "nichts installiert" }
          if (-not (Test-Path "$env:APPDATA\PrintDock\sprachen\en.json")) { throw "Sprachdateien fehlen" }
          Get-Content "$env:APPDATA\PrintDock\sprache"
          $u = Start-Process "$env:LOCALAPPDATA\Programs\PrintDock\unins000.exe" -ArgumentList "/VERYSILENT" -PassThru -Wait
          if ($u.ExitCode -ne 0) { throw "Deinstallation: Fehlercode $($u.ExitCode)" }
      - name: An das Release haengen
        shell: bash
        run: gh release upload "v$VER" dist/PrintDock-setup.exe --clobber
